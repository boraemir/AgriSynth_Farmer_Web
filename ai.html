<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriSynth - Yapay Zeka Asistanı</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const savedTheme = localStorage.getItem('AgriSynth-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* --- TEMA RENKLERİ --- */
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface-hover: #f1f5f9;
            --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #10b981; --primary-hover: #059669; --info: #0ea5e9; 
            --danger: #ef4444; --ai-bg: #f8fafc; --user-msg-bg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --sidebar-bg: #f1f5f9;
        }
        
        [data-theme="dark"] {
            --bg: #0f172a; --surface: #1e293b; --surface-hover: #334155;
            --border: #334155; --text-main: #f8fafc; --text-muted: #94a3b8;
            --ai-bg: #0f172a; --user-msg-bg: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --sidebar-bg: #0b1120;
        }

        /* --- MOBİL UYGULAMA HİSSİYATI (DOKUNMATİK OPTİMİZASYONU) --- */
        html { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior-y: none; }
        button, a, .history-item { touch-action: manipulation; }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }

        /* --- LAYOUT --- */
        .app-container { display: flex; width: 100%; height: 100vh; }
        
        /* SOL MENÜ (Geçmiş Sohbetler) */
        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: all 0.3s; z-index: 20;}
        .sidebar-header { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .brand { font-size: 20px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        .brand i { color: var(--primary); }
        
        .new-chat-btn { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s; font-size: 14px; width: 100%; justify-content: flex-start; background: var(--surface);}
        .new-chat-btn:hover { border-color: var(--primary); color: var(--primary); }

        .chat-history { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px;}
        .history-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-radius: 10px; cursor: pointer; color: var(--text-main); transition: all 0.2s; font-size: 14px;}
        .history-item:hover { background: var(--surface-hover); }
        .history-item.active { background: rgba(16, 185, 129, 0.1); color: var(--primary); font-weight: 500;}
        .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display: flex; align-items: center; gap: 10px;}
        .history-actions { display: none; gap: 5px; }
        .history-item:hover .history-actions { display: flex; }
        .action-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 4px;}
        .action-btn:hover { color: var(--text-main); background: var(--border); }
        .action-btn.delete:hover { color: var(--danger); }

        .sidebar-footer { padding: 20px; border-top: 1px solid var(--border); }
        .back-panel-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); width: 100%; padding: 10px; border-radius: 8px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 14px;}
        .back-panel-btn:hover { background: var(--surface-hover); }

        /* SAĞ ALAN (Chat) */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--surface); position: relative; }
        
        .mobile-header { display: none; padding: 15px 20px; border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; background: var(--surface); z-index: 10;}
        .menu-toggle { background: transparent; border: none; color: var(--text-main); cursor: pointer; }

        .messages-container { flex: 1; overflow-y: auto; padding: 40px 0; display: flex; flex-direction: column; scroll-behavior: smooth;}
        
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-main); }
        .empty-icon { width: 80px; height: 80px; border-radius: 20px; background: rgba(16, 185, 129, 0.1); color: var(--primary); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        
        .message-row { display: flex; padding: 20px 40px; }
        .message-row.ai { background: var(--ai-bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .message-content { max-width: 800px; margin: 0 auto; display: flex; gap: 20px; width: 100%; line-height: 1.7; font-size: 15px; color: var(--text-main);}
        
        .avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold;}
        .avatar.user { background: var(--user-msg-bg); color: var(--text-main); }
        .avatar.ai { background: var(--primary); color: white; }
        
        .text-content { flex: 1; min-width: 0; white-space: pre-wrap; }

        .typing-indicator { display: flex; gap: 4px; align-items: center; height: 24px;}
        .typing-dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        .input-container { padding: 30px; background: linear-gradient(180deg, transparent, var(--surface) 20%); }
        .input-box { max-width: 800px; margin: 0 auto; position: relative; display: flex; align-items: flex-end; background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 10px 15px; box-shadow: var(--shadow); transition: border 0.3s;}
        .input-box:focus-within { border-color: var(--primary); }
        
        .chat-input { flex: 1; border: none; background: transparent; padding: 10px; color: var(--text-main); font-family: inherit; font-size: 15px; resize: none; max-height: 200px; outline: none; }
        
        .send-btn { width: 40px; height: 40px; border-radius: 10px; background: var(--primary); color: white; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; margin-bottom: 2px;}
        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn:disabled { background: var(--text-muted); cursor: not-allowed; transform: none; }

        .disclaimer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 15px; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -100%; height: 100%; z-index: 100; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
            .sidebar.open { left: 0; }
            .mobile-header { display: flex; }
            .message-row { padding: 15px; }
            .input-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand"><i data-feather="cpu"></i> AgriSynth</div>
                <button class="new-chat-btn" onclick="startNewChat()">
                    <i data-feather="edit" style="width:16px;"></i> Yeni Sohbet
                </button>
            </div>
            
            <div class="chat-history" id="chatHistoryList">
                </div>

            <div class="sidebar-footer">
                <a href="ciftci.html" class="back-panel-btn"><i data-feather="arrow-left" style="width:16px;"></i> Panele Dön</a>
            </div>
        </aside>

        <main class="chat-main" onclick="closeSidebarOnMobile()">
            <div class="mobile-header">
                <button class="menu-toggle" onclick="event.stopPropagation(); toggleSidebar();"><i data-feather="menu"></i></button>
                <div style="font-weight:600; font-size:15px;">AgriSynth</div>
                <div style="width:24px;"></div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon"><i data-feather="cpu" style="width:40px; height:40px;"></i></div>
                    <h2 style="font-size:24px; font-weight:700; margin-bottom:10px;">Size nasıl yardımcı olabilirim?</h2>
                    <p style="color:var(--text-muted); font-size:14px;">Hastalık tespiti, gübreleme, hasat zamanı veya hayvan sağlığı hakkında sorular sorun.</p>
                </div>
            </div>

            <div class="input-container">
                <div class="input-box">
                    <textarea id="userInput" class="chat-input" rows="1" placeholder="Yapay zekaya danışın..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="handleSend()"><i data-feather="arrow-up" style="width:20px;"></i></button>
                </div>
                <div class="disclaimer">AgriSynth AI hata yapabilir. Kritik veteriner veya zirai müdahalelerden önce uzmanınıza danışın.</div>
            </div>
        </main>
    </div>

    <script src="ai.js"></script>
</body>
</html>
