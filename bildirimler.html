<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSynth - Bildirimler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>(function(){ const t=localStorage.getItem('AgriSynth-theme')||'light'; document.documentElement.setAttribute('data-theme',t); })();</script>
    <style>
        :root {
            --bg:#f8fafc; --surface:#fff; --surface-2:#f1f5f9; --border:#e2e8f0;
            --text-main:#0f172a; --text-muted:#64748b;
            --primary:#10b981; --primary-hover:#059669; --primary-dim:rgba(16,185,129,0.08);
            --danger:#ef4444; --warning:#f59e0b; --info:#3b82f6;
            --shadow:0 4px 16px rgba(0,0,0,0.06); --shadow-lg:0 12px 32px rgba(0,0,0,0.12);
            --radius:18px; --navbar-h:68px; --transition:all 0.2s ease;
        }
        [data-theme="dark"] {
            --bg:#0f172a; --surface:#1e293b; --surface-2:#334155; --border:#334155;
            --text-main:#f1f5f9; --text-muted:#94a3b8;
            --primary-dim:rgba(16,185,129,0.1);
            --shadow:0 4px 16px rgba(0,0,0,0.35);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text-main);min-height:100vh;}

        .navbar{height:var(--navbar-h);background:var(--surface);border-bottom:1px solid var(--border);
            display:flex;align-items:center;padding:0 28px;gap:14px;position:sticky;top:0;z-index:200;box-shadow:var(--shadow);}
        [data-theme="light"] .navbar{background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);}
        [data-theme="dark"] .navbar{background:rgba(30,41,59,0.92);backdrop-filter:blur(12px);}
        .nav-brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--text-main);text-decoration:none;}
        .nav-brand i{color:var(--primary);}
        .nav-divider{width:1px;height:26px;background:var(--border);margin:0 6px;}
        .nav-page-title{font-size:14px;font-weight:600;color:var(--text-muted);}
        .nav-spacer{flex:1;}
        .nav-icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);
            width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
            cursor:pointer;transition:var(--transition);text-decoration:none;position:relative;}
        .nav-icon-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-dim);}
        .notif-badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:white;
            font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;
            display:flex;align-items:center;justify-content:center;padding:0 4px;}

        .page-wrap{max-width:780px;margin:0 auto;padding:32px 20px;}

        .page-header{margin-bottom:28px;}
        .page-header h1{font-size:26px;font-weight:800;margin-bottom:6px;}
        .page-header p{font-size:14px;color:var(--text-muted);}

        .tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--surface-2);
            padding:5px;border-radius:14px;width:fit-content;}
        .tab-btn{padding:8px 20px;border-radius:10px;border:none;background:transparent;
            font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:var(--transition);}
        .tab-btn.active{background:var(--surface);color:var(--text-main);box-shadow:var(--shadow);}

        .notif-list{display:flex;flex-direction:column;gap:14px;}

        .notif-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
            padding:20px;transition:var(--transition);position:relative;}
        .notif-card.unread{border-color:rgba(16,185,129,0.35);background:rgba(16,185,129,0.03);}
        .notif-card:hover{box-shadow:var(--shadow);}

        .unread-dot{position:absolute;top:20px;right:20px;width:9px;height:9px;
            border-radius:50%;background:var(--primary);}

        .notif-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
        .notif-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
            justify-content:center;flex-shrink:0;font-size:20px;}
        .notif-icon.purchase{background:rgba(59,130,246,0.1);}
        .notif-icon.approved{background:rgba(16,185,129,0.1);}
        .notif-icon.rejected{background:rgba(239,68,68,0.1);}
        .notif-icon.info{background:rgba(245,158,11,0.1);}

        .notif-content{flex:1;}
        .notif-title{font-size:15px;font-weight:700;margin-bottom:5px;}
        .notif-msg{font-size:13px;color:var(--text-muted);line-height:1.5;margin-bottom:8px;}
        .notif-meta{display:flex;gap:12px;flex-wrap:wrap;}
        .notif-meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-muted);}

        .notif-product-box{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
            padding:12px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
        .notif-product-name{font-size:14px;font-weight:700;}
        .notif-product-price{font-size:16px;font-weight:800;color:var(--primary);}

        .notif-actions{display:flex;gap:8px;flex-wrap:wrap;}
        
        /* Yenilenmiş Buton Tasarımları */
        .btn-approve{background:var(--primary);color:white;border:none;padding:9px 18px;border-radius:10px;
            font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:var(--transition);}
        .btn-approve:hover{background:var(--primary-hover);}
        .btn-approve:disabled{opacity:0.5;cursor:not-allowed;}
        
        .btn-reject{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,0.4);
            padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
            display:flex;align-items:center;gap:6px;transition:var(--transition);}
        .btn-reject:hover{background:var(--danger);color:white;}
        .btn-reject:disabled{opacity:0.5;cursor:not-allowed;}
        
        .btn-msg{background:transparent;color:var(--info);border:1px solid rgba(59,130,246,0.4);
            padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
            display:flex;align-items:center;gap:6px;transition:var(--transition);}
        .btn-msg:hover{background:var(--info);color:white;}
        
        .btn-mark-read{background:transparent;color:var(--text-muted);border:1px solid var(--border);
            padding:9px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:var(--transition);}
        .btn-mark-read:hover{color:var(--text-main);}

        .status-chip{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
        .status-chip.pending{background:rgba(245,158,11,0.1);color:var(--warning);border:1px solid rgba(245,158,11,0.25);}
        .status-chip.completed{background:rgba(16,185,129,0.1);color:var(--primary);border:1px solid rgba(16,185,129,0.25);}
        .status-chip.cancelled{background:rgba(239,68,68,0.1);color:var(--danger);border:1px solid rgba(239,68,68,0.25);}

        .empty-state{text-align:center;padding:80px 20px;color:var(--text-muted);}
        .empty-state .emoji{font-size:52px;margin-bottom:16px;}
        .empty-state h3{font-size:18px;font-weight:700;margin-bottom:8px;}
        .empty-state p{font-size:14px;}

        .skeleton-notif{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;}
        .skel-line{border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 25%,var(--border) 50%,var(--surface-2) 75%);
            background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:10px;}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        .toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border:1px solid var(--border);
            border-radius:14px;padding:14px 20px;display:flex;align-items:center;gap:10px;
            box-shadow:var(--shadow-lg);z-index:9999;transform:translateY(80px);opacity:0;
            transition:all 0.3s cubic-bezier(0.34,1.4,0.64,1);}
        .toast.show{transform:none;opacity:1;}
        .toast.success i{color:var(--primary);}
        .toast.error i{color:var(--danger);}
        .toast span{font-size:14px;font-weight:500;}

        @media(max-width:600px){
            .notif-actions{flex-direction:column;}
            .notif-actions button{width:100%;justify-content:center;}
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="nav-brand" href="#">
        <i data-feather="leaf"></i><span>AgriSynth</span>
    </a>
    <div class="nav-divider"></div>
    <span class="nav-page-title">Bildirimler</span>
    <div class="nav-spacer"></div>
    <button class="nav-icon-btn" onclick="toggleTheme()">
        <i data-feather="moon" id="themeIcon"></i>
    </button>
    <button class="nav-icon-btn" onclick="goBack()" title="Panele Dön">
        <i data-feather="arrow-left"></i>
    </button>
</nav>

<div class="page-wrap">
    <div class="page-header">
        <h1>🔔 Bildirimler</h1>
        <p>Satın alma talepleri ve diğer bildirimleriniz</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="setTab('all', this)">Tümü</button>
        <button class="tab-btn" onclick="setTab('unread', this)">Okunmamış</button>
        <button class="tab-btn" onclick="setTab('purchase_request', this)">Satın Alma Talepleri</button>
    </div>

    <div id="notifList"></div>
</div>

<div class="toast" id="toast">
    <i data-feather="check-circle" id="toastIcon"></i>
    <span id="toastMsg">İşlem başarılı</span>
</div>

<script src="bildirimler.js"></script>
</body>
</html>
