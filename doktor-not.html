<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriSynth - Hekim Notlarım</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* Ana Sayfadaki CSS Değişkenleri ve Temel Stillere Uyumluluk */
        :root {
            --bg: #f8fafc; --surface: #ffffff; --border: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b;
            --primary: #10b981; --info: #0ea5e9; --danger: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --surface: #1e293b; --border: #334155;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        /* --- MOBİL UYGULAMA HİSSİYATI (DOKUNMATİK OPTİMİZASYONU) --- */
        html { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior-y: none; }
        button, a, .nav-item { touch-action: manipulation; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 20px; display: flex; flex-direction: column; z-index: 100; transition: all 0.3s ease; }
        .content-area { flex: 1; overflow-y: auto; padding: 30px; }

        /* Sidebar Nav */
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; color: var(--text-muted); text-decoration: none; font-weight: 500; margin-bottom: 5px; transition: all 0.2s ease; }
        .nav-item:hover { background: rgba(14, 165, 233, 0.05); color: var(--text-main); }
        .nav-item.active { background: rgba(14, 165, 233, 0.1); color: var(--info); }

        /* Not Kartları */
        .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .note-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); position: relative; transition: transform 0.2s; }
        .note-card:hover { transform: translateY(-2px); }
        .note-title { font-weight: 700; font-size: 16px; margin-bottom: 10px; color: var(--text-main); padding-right: 30px; }
        .note-content { font-size: 14px; color: var(--text-muted); line-height: 1.5; white-space: pre-wrap; }
        .note-date { font-size: 11px; color: var(--text-muted); margin-top: 15px; border-top: 1px solid var(--border); padding-top: 10px; display: block; }
        .note-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 4px; transition: 0.2s; }
        .btn-icon:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* Form Elemanları */
        .note-form { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: var(--shadow); }
        .form-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text-main); margin-bottom: 10px; font-family: inherit; box-sizing: border-box; }
        .form-input:focus { border-color: var(--info); outline: none; }
        .btn-add { background: var(--info); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-add:hover { opacity: 0.9; }

        /* Başlık Alanı Mobil Düzenlemesi */
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }

        /* --- MOBİL UYUM (RESPONSIVE) --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; justify-content: space-around; padding: 10px; border-right: none; border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; z-index: 1000; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
            .sidebar > div:first-child { display: none; } /* Marka yazısını gizle */
            .sidebar nav { display: flex; flex-direction: row; justify-content: space-around; width: 100%; gap: 0; margin: 0; }
            .nav-item { flex-direction: column; gap: 4px; padding: 8px; border-radius: 8px; flex: 1; justify-content: center; font-size: 11px; margin-bottom: 0; }
            .nav-item span { display: none; }
            .content-area { padding: 15px 15px 85px 15px; } 
            .header-container h1 { font-size: 22px; }
            .notes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 30px;">AgriSynth Hekim</div>
        <nav>
            <a href="doktor.html" class="nav-item"><i data-feather="activity"></i><span>İlanlar</span></a>
            <a href="doktor-not.html" class="nav-item active"><i data-feather="edit-3"></i><span>Notlarım</span></a>
            <a href="chat.html" class="nav-item"><i data-feather="message-circle"></i><span>Mesajlar</span></a>
        </nav>
    </aside>

    <main class="content-area">
        <div class="header-container">
            <h1 style="margin: 0;">Hekim Not Defteri</h1>
            <p id="userName" style="font-weight: 500; color: var(--info); margin: 0;"></p>
        </div>

        <div class="note-form">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 16px;">Yeni Not Oluştur</h3>
            <input type="text" id="noteTitle" class="form-input" placeholder="Not Başlığı (Örn: Vaka Takibi - Sığır No: 42)">
            <textarea id="noteContent" class="form-input" rows="3" placeholder="Not detaylarını buraya yazın..."></textarea>
            <button class="btn-add" onclick="saveNote()"><i data-feather="plus"></i> Notu Kaydet</button>
        </div>

        <div id="notesContainer" class="notes-grid">
            </div>
    </main>

    <script src="doktor-not.js"></script>
</body>
</html>
