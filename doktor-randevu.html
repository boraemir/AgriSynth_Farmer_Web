<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AgriSynth - Doktor Randevu Yönetimi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* --- TEMA RENKLERİ --- */
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface-hover: #f1f5f9;
            --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b;
            --primary: #10b981; --primary-hover: #059669; --info: #0ea5e9; 
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
            --modal-bg: rgba(15, 23, 42, 0.6);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        [data-theme="dark"] {
            --bg: #0f172a; --surface: #1e293b; --surface-hover: #334155;
            --border: #334155; --text-main: #f8fafc; --text-muted: #94a3b8;
            --modal-bg: rgba(0, 0, 0, 0.8);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        /* --- MOBİL UYGULAMA HİSSİYATI (DOKUNMATİK OPTİMİZASYONU) --- */
        html { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior-y: none; }
        button, a, .nav-item, .card { touch-action: manipulation; }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }

        /* --- LAYOUT & SIDEBAR --- */
        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 20px; z-index: 100; transition: all 0.3s ease; }
        .sidebar-brand { font-size: 22px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; margin-bottom: 40px; padding-left: 10px;}
        .sidebar-brand i { color: var(--info); }
        .nav-menu { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 10px; color: var(--text-muted); font-weight: 500; cursor: pointer; transition: all 0.2s ease; text-decoration: none;}
        .nav-item:hover { background: var(--surface-hover); color: var(--text-main); }
        .nav-item.active { background: rgba(14, 165, 233, 0.1); color: var(--info); font-weight: 600; }
        .content-area { flex: 1; overflow-y: auto; padding: 0 30px 40px 30px; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 70px; flex-direction: row; justify-content: space-around; padding: 10px; border-right: none; border-top: 1px solid var(--border); position: fixed; bottom: 0; left: 0; z-index: 1000; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
            .sidebar-brand { display: none; }
            .nav-menu { flex-direction: row; justify-content: space-around; width: 100%; gap: 0; }
            .nav-item { flex-direction: column; gap: 4px; padding: 8px; border-radius: 8px; flex: 1; justify-content: center; font-size: 11px; }
            .nav-item span { display: none; }
            .content-area { padding: 15px 15px 85px 15px; } 
        }

        /* --- ORTAK COMPONENTLER --- */
        .page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-top: 30px;}
        .page-header h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
        .page-header p { color: var(--text-muted); font-size: 14px;}
        
        .btn-success { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34,197,94,0.3); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition: all 0.2s;}
        .btn-success:hover { background: var(--success); color: white; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition: all 0.2s;}
        .btn-danger:hover { background: var(--danger); color: white; }
        .btn-whatsapp { background: #25D366; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition: all 0.2s;}
        .btn-whatsapp:hover { background: #128C7E; transform: translateY(-1px); }

        /* --- SEKMELER --- */
        /* Mobilde yan yana kayması için overflow eklendi */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; } /* Chrome ve Safari için scroll gizleme */
        .tab-btn { background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 15px; padding: 10px 15px; cursor: pointer; position: relative; white-space: nowrap; }
        .tab-btn.active { color: var(--info); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -11px; left: 0; width: 100%; height: 3px; background: var(--info); border-radius: 3px 3px 0 0; }

        /* --- RANDEVU KARTLARI --- */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
        
        .apt-status { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; margin-bottom: 15px;}
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid rgba(245,158,11,0.2); }
        .status-approved { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34,197,94,0.2); }
        .status-rejected { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
        
        .farmer-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .farmer-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--surface-hover); border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
        .farmer-info h3 { font-size: 16px; font-weight: 600; color: var(--text-main); }
        .farmer-info p { font-size: 12px; color: var(--text-muted); }

        .apt-detail-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .apt-detail-row i { width: 14px; margin-top: 2px; color: var(--info); }
        
        .animal-box { background: var(--surface-hover); border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; font-size: 12px; color: var(--text-main); }
        .card-actions { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand"><i data-feather="heart"></i><span>AgriSynth Hekim</span></div>
        <div class="nav-menu">
            <a href="doktor.html" class="nav-item"><i data-feather="arrow-left"></i><span>Panele Dön</span></a>
            <div class="nav-item active"><i data-feather="calendar"></i><span>Randevularım</span></div>
        </div>
    </aside>

    <main class="content-area">
        <div class="page-header">
            <div><h1>Randevu Yönetimi</h1><p>Çiftçilerden gelen talepleri yönetin, programınızı düzenleyin.</p></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('pending', this)">Bekleyen Onaylar</button>
            <button class="tab-btn" onclick="switchTab('approved', this)">Onaylananlar</button>
            <button class="tab-btn" onclick="switchTab('rejected', this)">Geçmiş / İptal Edilenler</button>
        </div>

        <div id="loadingStatus" style="text-align:center; padding:40px; color:var(--info); display:none;">
            <i data-feather="loader" style="animation: spin 1s linear infinite;"></i> Yükleniyor...
        </div>

        <div id="appointmentsContainer" class="grid-container"></div>
    </main>

    <script src="doktor-randevu.js"></script>
</body>
</html>
